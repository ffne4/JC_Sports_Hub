name: jc_sports_hub
description: JC Sports Hub - Sports management and community app for Makerere University Jinja Campus.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core - must always be first
  firebase_core: ^3.6.0

  # Authentication - login, signup, OTP
  firebase_auth: ^5.3.1
  http: ^1.6.0
  mailer: ^6.1.2

  # Database - stores all our app data
  cloud_firestore: ^5.4.4

  # Push notifications - score updates, match alerts
  firebase_messaging: ^15.1.3

  # File storage - images and media
  firebase_storage: ^12.3.2

  # State management - tracks who is logged in across screens
  provider: ^6.1.2

  # Image picking from phone gallery or camera
  image_picker: ^1.1.2

  # Date and time formatting
  intl: ^0.19.0

  # Unique ID generation
  uuid: ^4.5.1

  # Fast image loading with caching
  cached_network_image: ^3.4.1

  # Default Flutter icon package
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true